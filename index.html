<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deshoja el Girasol 🌻</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Sacramento&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Audio MP3 de fondo -->
  <audio id="musicaFondo" loop src="cancion.mp3"></audio>

  <!-- Botón de música -->
  <button id="btnMusica" class="btn-musica">🎵 Reproducir Música</button>

  <!-- Abejas y Mariposas Flotantes en el Fondo -->
  <div class="bicho mariposa m1">🦋</div>
  <div class="bicho mariposa m2">🦋</div>
  <div class="bicho abeja a1">🐝</div>
  <div class="bicho abeja a2">🐝</div>

  <header class="header">
    <h1>🌻 Deshoja el Girasol 🌻</h1>
    <p>Haz clic en cada pétalo u hoja para descubrir un mensaje especial con foto.</p>
  </header>

  <main class="contenedor-principal">
    <div id="girasolContainer" class="girasol-container"></div>
  </main>

  <div class="controles">
    <button id="btnReiniciar" class="btn-reiniciar">🔄 Volver a Armar el Girasol</button>
  </div>

  <!-- Modal emergente para las fotos y frases -->
  <div id="modalFrase" class="modal oculto">
    <div class="modal-contenido">
      <span id="cerrarModal" class="cerrar">&times;</span>
      <img id="modalImagen" src="" alt="Foto especial" />
      <p id="modalTexto" class="modal-texto"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
